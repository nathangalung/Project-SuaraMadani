# Production stack, run by deploy.sh
# Secrets: --env-file /run/suara-madani/app.env
name: suara-madani

x-app: &app
  image: ${APP_IMAGE:?}:${IMAGE_TAG:?set by deploy.sh}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging: &logging
    driver: local
    options:
      max-size: 20m
      max-file: "5"

x-hardened: &hardened
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging: *logging

services:
  cloudflared:
    <<: *hardened
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    volumes:
      - type: bind
        source: ${RUN_DIR:-/run/suara-madani}/cloudflared.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    oom_score_adj: -100
    networks: [edge]
    depends_on:
      caddy:
        condition: service_started

  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /data:size=8m
      - /config:size=8m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./503.html:/etc/caddy/503.html:ro
      - caddy-logs:/var/log/caddy
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/assets
        target: /srv/assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/public
        target: /srv/public
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 256m
    cpus: 1
    oom_score_adj: -100
    networks:
      edge:
        ipv4_address: 172.31.10.10
      app: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    <<: *app
    command: ["bun", "server/index.ts"]
    environment:
      APEX_HOST: ${APEX_HOST:?}
      DATABASE_URL: postgres://sm_app:${SM_APP_PASSWORD:?}@postgres:5432/suara_madani
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:?}
      LACAK_LINK_KEYS: ${LACAK_LINK_KEYS:?}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      # Seals codes in whatsapp-send jobs
      WHATSAPP_JOB_KEY: ${WHATSAPP_JOB_KEY:?}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      EMAIL_FROM: ${EMAIL_FROM:?}
      BREVO_API_KEY: ${BREVO_API_KEY:?}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
      ANON_CDN_TTL: ${ANON_CDN_TTL:-60}
      INTAKE_PAUSED: ${INTAKE_PAUSED:-false}
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?}
      FILES_DIR: /files
      HEALTH_BACKUP_CHECKS: ${HEALTH_BACKUP_CHECKS:-true}
    volumes:
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/evidence
        target: /files/evidence
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/derived
        target: /files/derived
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 768m
    cpus: 2
    oom_score_adj: 0
    networks: [app, db]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["bun", "worker/index.ts"]
    environment:
      WORKER_QUEUES: aggregate-refresh,email-send,issue-notify,demand-notify,takedown,maintenance-daily
      WORKER_HEARTBEAT: /tmp/alive
      APEX_HOST: ${APEX_HOST:?}
      DATABASE_URL: postgres://sm_app:${SM_APP_PASSWORD:?}@postgres:5432/suara_madani
      LACAK_LINK_KEYS: ${LACAK_LINK_KEYS:?}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      EMAIL_FROM: ${EMAIL_FROM:?}
      BREVO_API_KEY: ${BREVO_API_KEY:?}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:?}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
      MEDIA_R2_ENDPOINT: ${MEDIA_R2_ENDPOINT:?}
      MEDIA_R2_BUCKET: ${MEDIA_R2_BUCKET:?}
      MEDIA_R2_ACCESS_KEY_ID: ${MEDIA_R2_ACCESS_KEY_ID:?}
      MEDIA_R2_SECRET_ACCESS_KEY: ${MEDIA_R2_SECRET_ACCESS_KEY:?}
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?}
      FILES_DIR: /files
    volumes:
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/evidence
        target: /files/evidence
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/derived
        target: /files/derived
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/public
        target: /files/public
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1
    oom_score_adj: 200
    networks: [db]
    healthcheck:
      # Heartbeat after start, each self-check
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/alive) )) -lt 150"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # WhatsApp codes, one socket
  worker-whatsapp:
    <<: *app
    # Started by name only, lever
    profiles: [whatsapp]
    command: ["bun", "worker/index.ts"]
    environment:
      WORKER_QUEUES: whatsapp-send
      WORKER_HEARTBEAT: /tmp/alive
      DATABASE_URL: postgres://sm_app:${SM_APP_PASSWORD:?}@postgres:5432/suara_madani
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-baileys}
      WHATSAPP_JOB_KEY: ${WHATSAPP_JOB_KEY:?}
      # Baileys only, app checks
      WHATSAPP_CREDS_KEY: ${WHATSAPP_CREDS_KEY:-}
      META_WA_TOKEN: ${META_WA_TOKEN:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_TEMPLATE: ${META_WA_TEMPLATE:-}
      META_WA_LANGUAGE: ${META_WA_LANGUAGE:-id}
    mem_limit: 384m
    cpus: 0.5
    oom_score_adj: 300
    # db plus egress to WhatsApp
    networks: [db]
    healthcheck:
      # Heartbeat after start, each self-check
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/alive) )) -lt 150"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  worker-media:
    <<: *app
    command: ["bun", "worker/index.ts"]
    environment:
      WORKER_QUEUES: evidence,evidence-video,evidence-publish,evidence-brief
      WORKER_HEARTBEAT: /tmp/alive
      DATABASE_MEDIA_URL: postgres://sm_media:${SM_MEDIA_PASSWORD:?}@postgres:5432/suara_madani
      MEDIA_R2_ENDPOINT: ${MEDIA_R2_ENDPOINT:?}
      MEDIA_R2_BUCKET: ${MEDIA_R2_BUCKET:?}
      MEDIA_R2_ACCESS_KEY_ID: ${MEDIA_R2_ACCESS_KEY_ID:?}
      MEDIA_R2_SECRET_ACCESS_KEY: ${MEDIA_R2_SECRET_ACCESS_KEY:?}
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      FILES_DIR: /files
      # Decoder scratch on disk
      TMPDIR: /scratch
    volumes:
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/evidence
        target: /files/evidence
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/derived
        target: /files/derived
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/public
        target: /files/public
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}/scratch
        target: /scratch
        bind:
          create_host_path: false
    mem_limit: 1536m
    cpus: 1.5
    oom_score_adj: 500
    networks: [media, scan]
    healthcheck:
      # Heartbeat after start, each self-check
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/alive) )) -lt 150"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      # Scans wait for signatures
      clamav:
        condition: service_healthy
        # stack-test runs without clamav
        required: false

  migrate:
    <<: *app
    profiles: [migrate]
    restart: "no"
    command: ["bun", "db/migrate.ts"]
    environment:
      DATABASE_MIGRATOR_URL: postgres://sm_migrator:${SM_MIGRATOR_PASSWORD:?}@postgres:5432/suara_madani
    mem_limit: 512m
    cpus: 1
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:?}:${POSTGRES_TAG:?}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: suara_madani
      SM_DATABASE: suara_madani
      SM_MIGRATOR_PASSWORD: ${SM_MIGRATOR_PASSWORD:?}
      SM_APP_PASSWORD: ${SM_APP_PASSWORD:?}
      SM_MEDIA_PASSWORD: ${SM_MEDIA_PASSWORD:?}
      SM_BACKUP_PASSWORD: ${SM_BACKUP_PASSWORD:?}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:?}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:?}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:?}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:?}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?}
    shm_size: 256mb
    volumes:
      - type: bind
        source: ${PGDATA_ROOT:-/mnt/pgdata}/data
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    mem_limit: 3g
    cpus: 2
    oom_score_adj: -300
    networks: [db, media]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "suara_madani"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  clamav:
    <<: *hardened
    image: clamav/clamav:1.5.4-debian13-slim@sha256:9a96980b265cb2b51a20bdcca921dc80aa55ed0e56cdfb076198ee27a9171927
    environment:
      # Starting Values: above PDF limit
      CLAMD_CONF_StreamMaxLength: 12M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 3g
    cpus: 1
    oom_score_adj: 800
    networks: [scan]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Evidence backup, run by timer
  restic:
    profiles: [backup]
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      AWS_ACCESS_KEY_ID: ${RESTIC_S3_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_S3_KEY_SECRET:?}
      RESTIC_CACHE_DIR: /cache
    volumes:
      - restic-cache:/cache
      - type: bind
        source: ${FILES_ROOT:-/mnt/files}
        target: /files
        read_only: true
        bind:
          create_host_path: false
    # Counted in the host floor
    mem_limit: 512m
    cpus: 0.5
    logging: *logging
    networks: [backup]

volumes:
  caddy-logs:
  clamav-db:
  restic-cache:

# Fixed subnets, Caddy trusts edge
networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.10.0/24
  app:
    ipam:
      config:
        - subnet: 172.31.11.0/24
  db:
    ipam:
      config:
        - subnet: 172.31.12.0/24
  media:
    ipam:
      config:
        - subnet: 172.31.13.0/24
  # clamd needs freshclam egress
  scan:
    ipam:
      config:
        - subnet: 172.31.14.0/24
  backup:
    ipam:
      config:
        - subnet: 172.31.15.0/24
