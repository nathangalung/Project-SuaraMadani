# TYPE  DATABASE        USER                ADDRESS         METHOD
# Socket: container postgres user only
local   all             postgres                            peer
# In-container checks only
host    all             all                 127.0.0.1/32    scram-sha-256
# db network: web, workers, migrate
host    sadar_bersuara  sb_app,sb_migrator  172.31.12.0/24  scram-sha-256
# media network: worker-media only
host    sadar_bersuara  sb_media            172.31.13.0/24  scram-sha-256
# GlitchTip joins db and media
host    glitchtip       glitchtip           172.31.12.0/24  scram-sha-256
host    glitchtip       glitchtip           172.31.13.0/24  scram-sha-256
# stats network: Umami only
host    umami           umami               172.31.16.0/24  scram-sha-256
# Everything else refused
host    all             all                 0.0.0.0/0       reject
host    all             all                 ::/0            reject
