pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: bunx --bun biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      run: bun run typecheck
    # Staged secrets, before the push
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
