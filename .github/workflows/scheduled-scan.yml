# Weekly scan, new advisories surface
name: Scheduled Scan

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=google/osv-scanner extractVersion=^v(?<version>.+)$
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install osv-scanner
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan lockfile
        env:
          OSV_REPORT: ${{ runner.temp }}/osv-lockfile.json
        run: infra/osv-scan.sh lockfile bun.lock
      - name: Build image
        if: always()
        run: >-
          docker build -f infra/Dockerfile --target runtime -t sadar-bersuara:scan
          --build-arg GIT_SHA="$GITHUB_SHA"
          --build-arg PGBOSS_VERSION="$(jq -r '.dependencies["pg-boss"]' package.json)" .
      - name: Scan image
        if: always()
        env:
          OSV_REPORT: ${{ runner.temp }}/osv-app.json
        run: infra/osv-scan.sh image sadar-bersuara:scan
      # SC-16: report only, decisions.md
      - name: Scan postgres image
        if: always()
        continue-on-error: true
        env:
          OSV_REPORT: ${{ runner.temp }}/osv-postgres.json
        run: |
          docker build -f infra/postgres.Dockerfile -t sadar-bersuara-postgres:scan infra
          infra/osv-scan.sh image sadar-bersuara-postgres:scan
      # Digest-pinned vendor images, compose.yaml
      - name: Scan vendor images
        if: always()
        continue-on-error: true
        run: |
          rc=0
          while read -r ref; do
            name="${ref##*/}"
            name="${name%%[:@]*}"
            OSV_REPORT="$RUNNER_TEMP/osv-vendor-$name.json" infra/osv-scan.sh image "$ref" || rc=1
          done < <(grep -oE 'image: [^ ]+@sha256:[0-9a-f]{64}' infra/compose.yaml | cut -d' ' -f2)
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-weekly
          path: ${{ runner.temp }}/osv-*.json
          if-no-files-found: ignore
          retention-days: 90
