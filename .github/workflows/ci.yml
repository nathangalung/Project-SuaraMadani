# PLAN §10.7 gates, then deploy
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=google/osv-scanner extractVersion=^v(?<version>.+)$
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # renovate: datasource=github-releases depName=sbdchd/squawk extractVersion=^v(?<version>.+)$
  SQUAWK_VERSION: 2.66.0
  SQUAWK_SHA256: e7965f8146b53cfa7a4625ceecfea5c6aeb35add39132210aa60b11ae180b9f4
  # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Bun only: node fails
      - name: No Node
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          printf '#!/bin/sh\necho "::error::node ran: $*" >&2\nexit 1\n' >"$RUNNER_TEMP/no-node/node"
          chmod +x "$RUNNER_TEMP/no-node/node"
          echo "$RUNNER_TEMP/no-node" >>"$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Test environment
        run: |
          cp .env.example .env
          {
            echo "BETTER_AUTH_SECRETS=1:$(openssl rand -base64 32)"
            echo "LACAK_LINK_KEYS=1:$(openssl rand -base64 32)"
            echo "AUDIT_HMAC_KEY=$(openssl rand -base64 32)"
          } >> .env
      # Postgres, clamd and Mailpit
      - name: Services
        run: |
          bun run db:up
          docker compose -f infra/compose.dev.yaml --profile media build media-test
      - run: bun run typecheck
      - run: bunx --bun biome ci .
      # ADR-24: 99% scenarios automated
      - run: bun run acceptance
      # heif-dec, pdftoppm, ffmpeg live here
      # ADR-24: suite once, 99% coverage
      # CI makes Bun refuse .only
      - name: Test and coverage
        run: >-
          docker compose -f infra/compose.dev.yaml --profile media run --rm
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI media-test bun run coverage
      - run: bun run build
      - run: bun run size
      - run: bun run knip
      - name: Shellcheck
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c
          tar -xJf shellcheck.tar.xz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" infra/*.sh
      - name: No published ports
        run: |
          if grep -nE '^\s+ports:' infra/compose.yaml; then
            echo "::error::infra/compose.yaml publishes a port"
            exit 1
          fi
      - name: No sql.raw outside migrations
        run: |
          if grep -rnE 'sql\.raw\(' app server worker db shared \
            --include='*.ts' --include='*.tsx' \
            | grep -v '^db/migrations/' | grep -v 'sql-raw-ok:'; then
            echo "::error::sql.raw( needs // sql-raw-ok: <reason>"
            exit 1
          fi
      # Tenant comes from Host only
      - name: No activeOrganizationId reads
        run: |
          if grep -rn 'activeOrganizationId' app server worker shared db \
            --include='*.ts' --include='*.tsx' \
            | grep -vE '^(server/auth\.server\.ts|db/schema/auth\.ts):'; then
            echo "::error::tenant comes from the Host"
            exit 1
          fi
      - name: Password auth everywhere
        run: |
          if grep -nw trust infra/pg-hba.conf || grep -n POSTGRES_HOST_AUTH_METHOD infra/compose*.yaml; then
            echo "::error::trust auth is not allowed"
            exit 1
          fi

  # PLAN §10.7: Playwright and axe
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Environment and sample data
        run: |
          cp .env.example .env
          {
            echo "BETTER_AUTH_SECRETS=1:$(openssl rand -base64 32)"
            echo "LACAK_LINK_KEYS=1:$(openssl rand -base64 32)"
            echo "AUDIT_HMAC_KEY=$(openssl rand -base64 32)"
          } >> .env
          bun run db:up
          bun run db:migrate
          bun db/seed/regions.ts
          bun db/seed/organizations.ts
      # Seed runs the media pipeline
      - name: Sample data
        run: |
          docker compose -f infra/compose.dev.yaml --profile media build media-test
          docker compose -f infra/compose.dev.yaml --profile media run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp media-test bun run db:seed:sample
      - run: bun run build
      - name: Production server on 5198
        run: |
          PORT=5198 NODE_ENV=production EMAIL_PROVIDER=brevo BREVO_API_KEY=unused \
            bun --env-file=.env server/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -H 'Host: itb.localhost' http://127.0.0.1:5198/healthz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run e2e
      # PLAN §10.8 on sample data
      - name: Lighthouse budgets, populated pages
        run: |
          first() {
            curl -fsS -H 'Host: itb.localhost' "http://127.0.0.1:5198$1" |
              grep -o "href=\"$2[A-Z0-9-]*\"" | sed -n 1p | cut -d'"' -f2
          }
          paths=(/ /isu /data /tuntutan "$(first /tuntutan /tuntutan/TUN-)" "$(first /isu /isu/ISU-)")
          infra/lighthouse.sh 5198 "$RUNNER_TEMP" "${paths[@]}"
          bun infra/lighthouse-budget.ts "$RUNNER_TEMP"/lh-*.json

  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install scanners
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  bin/osv-scanner" | sha256sum -c
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz -C bin gitleaks
          curl -fsSLo bin/squawk "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "$SQUAWK_SHA256  bin/squawk" | sha256sum -c
          chmod +x bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Fixable HIGH or CRITICAL fails
      - name: Scan lockfile
        env:
          OSV_REPORT: ${{ runner.temp }}/osv-lockfile.json
        run: infra/osv-scan.sh lockfile bun.lock
      # SC-17: every finding kept
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-lockfile
          path: ${{ runner.temp }}/osv-lockfile.json
          if-no-files-found: ignore
          retention-days: 90
      - run: gitleaks git --redact --no-banner .
      - name: New migrations
        id: migrations
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "files<<EOF"
            git diff --name-only --diff-filter=A "$BASE" HEAD -- 'db/migrations/*.sql'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Decisions: these rules stay off
      - name: squawk
        if: steps.migrations.outputs.files != ''
        env:
          FILES: ${{ steps.migrations.outputs.files }}
        run: |
          mapfile -t files <<<"$FILES"
          squawk --assume-in-transaction \
            --exclude=prefer-robust-stmts,require-concurrent-index-creation,require-concurrent-index-deletion,require-statement-timeout,require-lock-timeout,prefer-bigint-over-int,prefer-bigint-over-smallint \
            "${files[@]}"
      - name: Contract migrations need the label
        if: contains(steps.migrations.outputs.files, '_contract.sql') && !contains(github.event.pull_request.labels.*.name, 'contract-migration')
        run: |
          echo "::error::a _contract migration needs the contract-migration label"
          exit 1

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build args
        id: args
        run: echo "pgboss=$(jq -r '.dependencies["pg-boss"]' package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          load: true
          tags: sadar-bersuara:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            PGBOSS_VERSION=${{ steps.args.outputs.pgboss }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra
          file: infra/postgres.Dockerfile
          load: true
          tags: sadar-bersuara-postgres:ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Scan image
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"
          PATH="$RUNNER_TEMP:$PATH" OSV_REPORT="$RUNNER_TEMP/osv-app.json" infra/osv-scan.sh image sadar-bersuara:ci
      # SC-16: report only, decisions.md
      - name: Scan postgres image
        continue-on-error: true
        run: PATH="$RUNNER_TEMP:$PATH" OSV_REPORT="$RUNNER_TEMP/osv-postgres.json" infra/osv-scan.sh image sadar-bersuara-postgres:ci
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-images
          path: ${{ runner.temp }}/osv-*.json
          if-no-files-found: ignore
          retention-days: 90
      # Production compose, port 5199
      # Runner has Chrome, Bun above
      - name: Stack test
        env:
          STACK_LIGHTHOUSE: "1"
        run: infra/stack-test.sh sadar-bersuara:ci sadar-bersuara-postgres:ci
      # Real deploy.sh, two rollbacks
      - name: Deploy rollback test
        run: infra/deploy-test.sh sadar-bersuara:ci sadar-bersuara-postgres:ci
      # Seed needs clamd, ffmpeg, poppler
      - name: Restore drill tools
        run: |
          bun install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils qpdf
          docker compose -f infra/compose.dev.yaml up -d --wait clamav
      # PITR, tenant load, restic copy
      - name: Restore drill
        run: infra/restore-test.sh

  deploy:
    # Off until a host exists
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [gates, e2e, scans, image]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      action: deploy
    secrets: inherit
