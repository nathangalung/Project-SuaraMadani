# Build once, deploy through Access
# Rollback: manual run, SHA
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      action:
        type: string
        default: deploy
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA
        type: string
        required: true
      action:
        type: choice
        options: [rollback, deploy]
        default: rollback

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARED_VERSION: 2026.9.3
  CLOUDFLARED_SHA256: bc073ef293d504cf5ac533bd0aa1c824ef6b4f358765ccaa6628a8a95cacb4b7
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check SHA
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Names and tags
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source infra/lib.sh
          {
            echo "app=ghcr.io/$owner/suara-madani"
            echo "postgres=ghcr.io/$owner/suara-madani-postgres"
            echo "pgtag=$(postgres_tag)"
            echo "pgboss=$(jq -r '.dependencies["pg-boss"]' package.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Never latest, SHA tags only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.app }}:${{ inputs.sha }}
          build-args: |
            GIT_SHA=${{ inputs.sha }}
            PGBOSS_VERSION=${{ steps.meta.outputs.pgboss }}
          cache-from: type=gha
      # Content tag, rebuilt on change
      - name: Postgres image exists
        id: pg
        env:
          IMAGE: ${{ steps.meta.outputs.postgres }}:${{ steps.meta.outputs.pgtag }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pg.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra
          file: infra/postgres.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.postgres }}:${{ steps.meta.outputs.pgtag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Scan pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.app }}:${{ inputs.sha }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"
          PATH="$RUNNER_TEMP:$PATH" infra/osv-scan.sh image "$IMAGE"

  # No checkout, no bun install
  deploy:
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions: {}
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSLo "$RUNNER_TEMP/cloudflared.deb" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared.deb" | sha256sum -c
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
      # Forced command runs deploy-gate.sh
      - name: Deploy over Access SSH
        env:
          SHA: ${{ inputs.sha }}
          ACTION: ${{ inputs.action }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTION" == deploy || "$ACTION" == rollback ]]
          install -d -m 0700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            "deploy@$SSH_HOST" "$ACTION $SHA"
