# Build, test, deploy by digest
# Rollback: manual run, SHA
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      action:
        type: string
        default: deploy
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA
        type: string
        required: true
      action:
        type: choice
        options: [rollback, deploy]
        default: rollback

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=cloudflare/cloudflared
  CLOUDFLARED_VERSION: 2026.9.3
  CLOUDFLARED_SHA256: bc073ef293d504cf5ac533bd0aa1c824ef6b4f358765ccaa6628a8a95cacb4b7
  # renovate: datasource=github-releases depName=google/osv-scanner extractVersion=^v(?<version>.+)$
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.digests.outputs.app }}
      postgres: ${{ steps.digests.outputs.postgres }}
    steps:
      - name: Check SHA
        env:
          SHA: ${{ inputs.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Names and tags
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source infra/lib.sh
          {
            echo "app=ghcr.io/$owner/sadar-bersuara"
            echo "postgres=ghcr.io/$owner/sadar-bersuara-postgres"
            echo "pgtag=$(postgres_tag)"
            echo "pgboss=$(jq -r '.dependencies["pg-boss"]' package.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Never latest, SHA tags only
      - id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.app }}:${{ inputs.sha }}
          # ASVS V15.1.2: inventory per release
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_SHA=${{ inputs.sha }}
            PGBOSS_VERSION=${{ steps.meta.outputs.pgboss }}
          cache-from: type=gha
      # Content tag, rebuilt on change
      - name: Postgres image exists
        id: pg
        env:
          IMAGE: ${{ steps.meta.outputs.postgres }}:${{ steps.meta.outputs.pgtag }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - id: pgbuild
        if: steps.pg.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra
          file: infra/postgres.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.postgres }}:${{ steps.meta.outputs.pgtag }}
          sbom: true
          provenance: mode=max
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # SC-04: deploy pins these digests
      - name: Digests
        id: digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          PG_BUILT: ${{ steps.pgbuild.outputs.digest }}
          PG_IMAGE: ${{ steps.meta.outputs.postgres }}:${{ steps.meta.outputs.pgtag }}
        run: |
          pg="$PG_BUILT"
          if [[ -z "$pg" ]]; then
            pg="$(docker buildx imagetools inspect "$PG_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi
          re='^sha256:[0-9a-f]{64}$'
          [[ "$APP_DIGEST" =~ $re && "$pg" =~ $re ]]
          { echo "app=$APP_DIGEST"; echo "postgres=$pg"; } >> "$GITHUB_OUTPUT"
      - name: Install osv-scanner
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.app }}@${{ steps.digests.outputs.app }}
          OSV_REPORT: ${{ runner.temp }}/osv-app.json
        run: infra/osv-scan.sh image "$IMAGE"
      # SC-16: report only, decisions.md
      - name: Scan postgres image
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.postgres }}@${{ steps.digests.outputs.postgres }}
          OSV_REPORT: ${{ runner.temp }}/osv-postgres.json
        run: infra/osv-scan.sh image "$IMAGE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-deploy
          path: ${{ runner.temp }}/osv-*.json
          if-no-files-found: ignore
          retention-days: 90
      # SC-05: test the deployed digests
      - name: Stack test pushed images
        env:
          APP: ${{ steps.meta.outputs.app }}@${{ steps.digests.outputs.app }}
          PG: ${{ steps.meta.outputs.postgres }}@${{ steps.digests.outputs.postgres }}
        run: infra/stack-test.sh "$APP" "$PG"

  # No checkout, no bun install
  deploy:
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions: {}
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSLo "$RUNNER_TEMP/cloudflared.deb" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared.deb" | sha256sum -c
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
      # Forced command runs deploy-gate.sh
      - name: Deploy over Access SSH
        env:
          SHA: ${{ inputs.sha }}
          ACTION: ${{ inputs.action }}
          APP_DIGEST: ${{ needs.build.outputs.app }}
          PG_DIGEST: ${{ needs.build.outputs.postgres }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTION" == deploy || "$ACTION" == rollback ]]
          command="$ACTION $SHA"
          if [[ "$ACTION" == deploy ]]; then
            command="$ACTION $SHA $APP_DIGEST $PG_DIGEST"
          fi
          install -d -m 0700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            "deploy@$SSH_HOST" "$command"
